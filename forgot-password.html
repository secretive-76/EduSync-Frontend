<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="FinalEdu/edu2.O/Edu2.0/Edu2.0/Edu2.0/Edu2.0/">
    <title>Forgot Password | EduSync</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card" style="max-width: 440px; border-top: 8px solid #800020;">
        <h1 style="margin-bottom: 10px;">Forgot Password</h1>
        <p style="color: #6d4c41; margin-bottom: 25px;">Enter your email address and we'll send you a secure reset link.</p>

        <input type="email" id="forgotEmail" placeholder="Email Address" required>
        <button class="btn-main" id="sendResetBtn" onclick="sendResetLink()" style="background:#800020;">Send Reset Link</button>

        <p id="forgotMessage" style="display:none; margin-top:16px; color:#166534; font-size:0.92rem;"></p>

        <p style="margin-top: 20px; font-size: 0.92rem;">
            <a href="/index.html" style="color: #800020; font-weight: 700; text-decoration: none;">Back to Login</a>
        </p>
    </div>

    <script src="js/app.js"></script>
    <script>
        const DEFAULT_API_BASE_URL = 'https://edusync-life-1.onrender.com';

        const resolveApiBaseUrl = window.resolveApiBaseUrl || function () {
            const configuredBase = typeof window.API_BASE_URL === 'string' ? window.API_BASE_URL.trim() : '';
            if (configuredBase) {
                return configuredBase.replace(/\/+$/, '');
            }

            const { protocol, hostname } = window.location;
            if (protocol === 'file:' || ['localhost', '127.0.0.1', '::1'].includes(hostname)) {
                return 'http://localhost:5000';
            }

            return DEFAULT_API_BASE_URL;
        };
        const API_ROOT = resolveApiBaseUrl();
        const getApiUrl = window.getApiUrl || function (endpoint = '', params) {
            const baseUrl = API_ROOT;
            const rawEndpoint = String(endpoint).trim();
            const normalizedEndpoint = rawEndpoint
                ? (/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(rawEndpoint)
                    ? rawEndpoint
                    : (() => {
                        const [pathPart, queryPart = ''] = rawEndpoint.split('?');
                        const cleanPath = pathPart.replace(/^\/+|\/+$/g, '');
                        const normalizedPath = cleanPath ? `/${cleanPath}` : '';
                        return queryPart ? `${normalizedPath}?${queryPart}` : normalizedPath;
                    })())
                : '';

            if (!params) {
                return normalizedEndpoint ? `${baseUrl}${normalizedEndpoint}` : baseUrl;
            }

            const [pathPart, existingQuery = ''] = normalizedEndpoint.split('?');
            const queryParams = new URLSearchParams();
            Object.entries(params).forEach(([key, value]) => {
                if (value === undefined || value === null || value === '') {
                    return;
                }
                queryParams.set(key, String(value));
            });

            const queryString = queryParams.toString();
            const mergedQuery = [existingQuery, queryString].filter(Boolean).join('&');
            return mergedQuery ? `${baseUrl}${pathPart}?${mergedQuery}` : `${baseUrl}${pathPart}`;
        };

        async function sendResetLink() {
            const emailInput = document.getElementById('forgotEmail');
            const message = document.getElementById('forgotMessage');
            const button = document.getElementById('sendResetBtn');
            const email = emailInput.value.trim();
            const requestUrl = getApiUrl('/api/auth/forgot-password');

            if (!email) {
                alert('Please enter your email address so we can send your reset link. 📧');
                return;
            }

            button.disabled = true;
            button.textContent = 'Sending...';

            try {
                const response = await fetch(requestUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();
                message.style.display = 'block';
                message.style.color = '#166534';
                message.textContent = result.message || 'If an account exists with this email, a reset link has been sent.';
            } catch (error) {
                if (error instanceof TypeError) {
                    console.error('Failed URL:', requestUrl);
                }
                console.error('Forgot password request failed:', error);
                message.style.display = 'block';
                message.style.color = '#991b1b';
                message.textContent = 'We could not send the reset link right now. Please try again.';
            } finally {
                button.disabled = false;
                button.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
