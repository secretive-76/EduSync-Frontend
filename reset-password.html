<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EduSync</title>
    <link rel="stylesheet" href="FinalEdu/edu2.O/Edu2.0/Edu2.0/Edu2.0/Edu2.0/css/style.css">
</head>
<body class="login-body">
    <div class="login-card" style="max-width: 460px; border-top: 8px solid #800020;">
        <h1 style="margin-bottom: 10px;">Reset Password</h1>
        <p style="color: #6d4c41; margin-bottom: 25px;">Set your new password below.</p>

        <input type="password" id="newPassword" placeholder="New Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button class="btn-main" id="resetBtn" onclick="submitResetPassword()" style="background:#800020;">Reset Password</button>

        <p id="resetMessage" style="display:none; margin-top:16px; font-size:0.92rem;"></p>

        <p style="margin-top: 20px; font-size: 0.92rem;">
            <a href="index.html" style="color: #800020; font-weight: 700; text-decoration: none;">Back to Login</a>
        </p>
    </div>

    <script>
    const email = localStorage.getItem('resetEmail');
    const API_ROOT = window.API_BASE_URL || 'https://edusync-life-1.onrender.com';
    function getApiUrl(endpoint) {
        const cleanEndpoint = endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
        return `${API_ROOT}${cleanEndpoint}`;
    }

    if (!email) {
        alert('Session expired or invalid access. Please start the forgot password process again.');
        window.location.href = 'forgot-password.html';
    }

    async function submitResetPassword() {
        const otpField = document.getElementById('otpCode');
        const otpCode = otpField ? otpField.value : '';
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const message = document.getElementById('resetMessage');
        const button = document.getElementById('resetBtn');
        const requestUrl = getApiUrl('/api/auth/reset-password');

        if (!otpCode || !newPassword || !confirmPassword) {
            alert('Please fill in all fields.');
            return;
        }

        if (newPassword !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        button.disabled = true;
        button.textContent = 'Resetting...';

        try {
            const response = await fetch(requestUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email, 
                    otpCode: otpCode.trim(), 
                    newPassword 
                })
            });

            const result = await response.json();
            message.style.display = 'block';

            if (response.ok && result.success) {
                alert('Password updated! Redirecting to login...');
                localStorage.removeItem('resetEmail');
                window.location.href = 'index.html';
            } else {
                message.style.color = '#991b1b';
                message.textContent = result.message || 'Invalid or expired OTP.';
            }
        } catch (error) {
            if (error instanceof TypeError) {
                console.error('Failed URL:', requestUrl);
            }
            console.error('Reset password request failed:', error);
            message.style.display = 'block';
            message.style.color = '#991b1b';
            message.textContent = 'We could not reset the password right now. Please try again.';
        } finally {
            button.disabled = false;
            button.textContent = 'Reset Password';
        }
    }
</script>
</body>
</html>
