<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | EduSync</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Join EduSync! 📝</h2>
        <div id="registerFormSection">
            <input type="text" id="regName" placeholder="Username">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="password" id="regPass" placeholder="Set Password">
            <input type="password" id="regPassConfirm" placeholder="Retype Password">

            <button class="btn-main" id="registerButton" onclick="handleRegister()">Create Account ✅</button>
        </div>

        <div id="otpVerificationSection" class="otp-panel" style="display:none;">
            <h3 class="otp-title">Verify Your Email</h3>
            <p class="otp-subtitle">Enter the 6-digit code sent to your inbox to activate your account.</p>
            <input type="text" id="otpCode" class="otp-input" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
            <button class="btn-main" id="verifyOtpButton" onclick="handleOTPVerification()">Verify OTP 🔐</button>
            <button class="btn-main otp-resend-btn" id="resendButton" onclick="handleResendVerification()">Resend OTP 📧</button>
        </div>

        <div id="registerStatus" style="display:none; margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: 600;"></div>
        
        <p style="margin-top: 15px;">Already have an account? <a href="/index.html">Login</a></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
